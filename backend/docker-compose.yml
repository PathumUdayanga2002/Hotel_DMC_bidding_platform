      - ADMIN_EMAIL=movoinfo.com@gmail.com
      
      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_HOTEL_BIDDING=DEBUG
      - LOGGING_PATTERN_CONSOLE=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
      
      # CORS
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_ALLOWED_HEADERS=*
      - CORS_ALLOW_CREDENTIALS=true
      
      # Timezone
      - SPRING_JACKSON_TIME_ZONE=UTC
      - SPRING_JACKSON_DATE_FORMAT=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
      
      # Commission
      - COMMISSION_RATE=5.0
      
      # OTP
      - OTP_EXPIRATION_MINUTES=10
      
      # PayHere Payment Gateway
      - PAYHERE_MERCHANT_ID=1230399
      - PAYHERE_MERCHANT_SECRET=MTUxMTE5NjM4OTMxNDc2MzkyMDAyMzUwNjE2NzYyMTI0OTIwMzMyMg==
      - PAYHERE_CHECKOUT_URL=https://sandbox.payhere.lk/pay/checkout
      - PAYHERE_API_URL=https://sandbox.payhere.lk/merchant/v1
      - PAYHERE_CURRENCY=LKR
      
      # Payment Configuration
      - PAYMENT_TIMEOUT_MINUTES=15
      - PAYMENT_COMMISSION_RATE=0.05
      - PAYMENT_COMMISSION_PERCENTAGE=5.0
      
      # Application URLs
      - APP_FRONTEND_URL=http://localhost:5173
      - APP_BACKEND_URL=http://localhost:8081/api/v1
      
      # Exchange Rates (to LKR)
      - CURRENCY_RATE_USD=330.00
      - CURRENCY_RATE_EUR=360.00
      - CURRENCY_RATE_GBP=420.00
      - CURRENCY_RATE_INR=4.00
      - CURRENCY_RATE_AED=90.00
      - CURRENCY_RATE_LKR=1.00
      
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - hotel-bidding-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  hotel-bidding-network:
    driver: bridge

volumes:
  uploads:
  logs:
