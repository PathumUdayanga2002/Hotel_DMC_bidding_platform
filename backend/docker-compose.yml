version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-bidding-backend
    ports:
      - "8081:8081"
    environment:
      # Application
      - SPRING_APPLICATION_NAME=hotel-bidding-backend
      - SERVER_PORT=8081
      - SERVER_SERVLET_CONTEXT_PATH=/api/v1
      
      # MongoDB (using existing cloud MongoDB)
      - SPRING_DATA_MONGODB_URI=mongodb+srv://udayangap996_db_user:zRIsBOCv3QBQkGAo@cluster0.7ssrivn.mongodb.net/hotel_bidding_db
      - SPRING_DATA_MONGODB_AUTO_INDEX_CREATION=true
      
      # JWT
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - JWT_ACCESS_TOKEN_EXPIRATION=900000
      - JWT_REFRESH_TOKEN_EXPIRATION=604800000
      
      # Email (Gmail SMTP)
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=movoinfo.com@gmail.com
      - SPRING_MAIL_PASSWORD=mkad evuk rwai hsbi
